<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — System Error | SEVEN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FF4D00'/><text y='.9em' x='10' font-size='90' fill='%230F0F0F'>7</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F4F0; --ink: #0F0F0F; --accent: #FF4D00;
    --border: 2px solid var(--ink); --shadow: 8px 8px 0px var(--ink);
    --font-display: 'Space Grotesk', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg); color: var(--ink); font-family: var(--font-mono);
    height: 100vh; display: flex; justify-content: center; align-items: center;
    background-image: 
      linear-gradient(rgba(15, 15, 15, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15, 15, 15, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .error-box {
    background: #fff; border: 4px solid var(--ink); box-shadow: var(--shadow);
    padding: 4rem 2rem; text-align: center; max-width: 600px; width: 90%; position: relative;
  }
  .error-box::before {
    content: 'ERR_SYS_404'; position: absolute; top: -16px; left: 20px;
    background: var(--accent); color: #fff; padding: 4px 12px;
    font-family: var(--font-display); font-weight: 700; font-size: 0.9rem;
    border: var(--border); letter-spacing: 1px;
  }
  h1 { font-family: var(--font-display); font-size: 6rem; line-height: 1; margin-bottom: 1rem; color: var(--accent); letter-spacing: -2px; text-shadow: 4px 4px 0 var(--ink); }
  h2 { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: -0.5px; }
  p { font-size: 1rem; color: #444; margin-bottom: 2.5rem; line-height: 1.6; }
  .btn-return {
    display: inline-block; background: var(--ink); color: #fff; padding: 1rem 2rem;
    border: 4px solid var(--ink); font-family: var(--font-mono); font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; text-decoration: none;
    box-shadow: 4px 4px 0 var(--accent); transition: all 0.15s;
  }
  .btn-return:hover { transform: translate(4px, 4px); box-shadow: 0px 0px 0 var(--accent); background: var(--accent-blue); }
  @media (max-width: 600px) { h1 { font-size: 4rem; } h2 { font-size: 1.2rem; } .error-box { padding: 3rem 1.5rem; } }
</style>
</head>
<body>
<div class="error-box">
  <h1>404</h1>
  <h2>Route Not Found</h2>
  <p>The system could not locate the requested file or directory. It may have been moved, deleted, or you might have mistyped the URL.</p>
  <a href="/" class="btn-return">← Return to Hub</a>
</div>
</body>
</html>
